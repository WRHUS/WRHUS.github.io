<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#171717">

    <meta name="description"
          content="الموقع الرسمي للكاتب حسين أحمد">

    <title>حسين أحمد | الكاتب</title>


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;

            background: #f8f7f4;

            color: #222;

            font-family:
                "Noto Naskh Arabic",
                serif;

            overflow-x: hidden;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: inherit;
        }


        /* =====================================================
           VARIABLES
        ====================================================== */

        :root {

            --black:
                #171717;

            --black-soft:
                #202020;

            --cream:
                #eee5d8;

            --gold:
                #c6a06b;

            --gold-light:
                #dfbd88;

            --brown:
                #582a27;

            --brown-dark:
                #3f1e1c;

            --paper:
                #faf9f6;

            --dark-blue:
                #1b2229;

            --dark-blue-2:
                #252e37;
        }


        /* =====================================================
           NAVBAR
        ====================================================== */

        .navbar {

            width: 100%;
            height: 81px;

            position: relative;
            z-index: 100;

            background:
                linear-gradient(
                    180deg,
                    #1b1b1b 0%,
                    #151515 100%
                );

            border-bottom:
                1px solid
                rgba(202,168,112,.16);

            display: flex;

            align-items: center;

            justify-content: space-between;

            /*
             * نستخدم LTR هنا حتى يبقى
             * اسم الكاتب يسارًا والقائمة يمينًا
             */
            direction: ltr;

            padding:
                0 clamp(28px, 5.3vw, 80px);
        }


        /* =====================================================
           LOGO
        ====================================================== */

        .logo {

            direction: rtl;

            font-family:
                "Noto Naskh Arabic",
                serif;

            font-size:
                clamp(25px, 2.1vw, 34px);

            line-height: 1;

            font-weight: 500;

            color: #e9dfd0;

            white-space: nowrap;

            letter-spacing: -1.3px;

            transition:
                color .3s ease;
        }

        .logo:hover {
            color: var(--gold-light);
        }


        /* =====================================================
           DESKTOP NAV
        ====================================================== */

        .nav {

            direction: rtl;

            display: flex;

            align-items: center;

            gap:
                clamp(16px, 2vw, 31px);

            height: 100%;

            font-family:
                "Noto Kufi Arabic",
                sans-serif;

            font-size:
                clamp(10px, .82vw, 13px);

            color: #d8d0c5;
        }

        .nav a {

            position: relative;

            white-space: nowrap;

            height: 100%;

            display: flex;

            align-items: center;

            color: #d8d0c5;

            transition:
                color .25s ease;
        }

        .nav a:hover {
            color: #d6b47e;
        }

        .nav a::after {

            content: "";

            position: absolute;

            bottom: 20px;

            right: 0;

            width: 0;

            height: 1px;

            background:
                var(--gold);

            transition:
                width .3s ease;
        }

        .nav a:hover::after {
            width: 100%;
        }


        /* =====================================================
           DROPDOWN ARROW
        ====================================================== */

        .arrow {

            margin-right: 6px;

            font-size: 10px;

            color: #bba98e;

            transform:
                translateY(-1px);
        }


        /* =====================================================
           MOBILE MENU BUTTON
        ====================================================== */

        .mobile-menu {

            display: none;

            width: 42px;
            height: 42px;

            border: 1px solid
                rgba(202,168,112,.25);

            background:
                rgba(255,255,255,.025);

            color: #e9dfd0;

            cursor: pointer;

            font-size: 21px;

            align-items: center;
            justify-content: center;
        }


        /* =====================================================
           HERO
        ====================================================== */

        .hero {

            width: 100%;

            height: 422px;

            position: relative;

            background:

                radial-gradient(
                    ellipse at 18% 35%,
                    rgba(73,91,106,.22),
                    transparent 48%
                ),

                linear-gradient(
                    135deg,
                    #1b2026 0%,
                    #273038 48%,
                    #151a1e 100%
                );

            overflow: visible;
        }


        /* =====================================================
           HERO GEOMETRIC PANELS
        ====================================================== */

        .hero::before {

            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            background:

                linear-gradient(
                    142deg,
                    transparent 0%,
                    transparent 51.2%,
                    rgba(0,0,0,.32) 51.4%,
                    rgba(0,0,0,.32) 51.8%,
                    transparent 52%
                ),

                linear-gradient(
                    37deg,
                    transparent 0%,
                    transparent 76%,
                    rgba(255,255,255,.045) 76.2%,
                    rgba(255,255,255,.045) 76.7%,
                    transparent 77%
                ),

                linear-gradient(
                    125deg,
                    transparent 0%,
                    transparent 78%,
                    rgba(0,0,0,.2) 78.3%,
                    transparent 79%
                );
        }


        /* =====================================================
           HERO TOP RIGHT PANEL
        ====================================================== */

        .hero-panel {

            position: absolute;

            top: 0;
            right: 0;

            width: 46%;

            height: 188px;

            background:

                linear-gradient(
                    140deg,
                    rgba(255,255,255,.13),
                    rgba(120,120,120,.04)
                );

            clip-path:
                polygon(
                    28% 0,
                    100% 0,
                    100% 100%,
                    0 100%
                );

            opacity: .55;

            border-left:
                1px solid
                rgba(255,255,255,.08);
        }


        /* =====================================================
           HERO INNER
        ====================================================== */

        .hero-inner {

            width:
                min(1160px, 89%);

            height: 100%;

            margin: auto;

            position: relative;

            display: block;
        }


        /* =====================================================
           HERO TEXT
        ====================================================== */

        .hero-copy {

            position: absolute;

            top: 87px;

            left: 5%;

            width: 53%;

            text-align: right;

            z-index: 5;

            color: #eee6db;
        }

        .hero-description {

            max-width: 585px;

            margin-left: auto;

            font-family:
                "Noto Naskh Arabic",
                serif;

            font-size:
                clamp(17px, 1.55vw, 23px);

            line-height:
                1.88;

            font-weight: 500;

            letter-spacing:
                -.2px;

            text-shadow:
                0 2px 7px rgba(0,0,0,.5);
        }


        /* =====================================================
           HERO BUTTON
        ====================================================== */

        .hero-button {

            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 159px;

            height: 47px;

            margin-top: 27px;

            padding:
                0 22px;

            position: relative;

            background:

                linear-gradient(
                    180deg,
                    #6b322c 0%,
                    #4b211e 100%
                );

            border:
                1px solid
                #ae8051;

            color: #f1e6d5;

            font-family:
                "Noto Kufi Arabic",
                sans-serif;

            font-size: 12px;

            box-shadow:

                0 7px 17px
                rgba(0,0,0,.34),

                inset 0 1px 0
                rgba(255,255,255,.16);

            transition:
                all .3s ease;
        }


        .hero-button::before {

            content: "";

            position: absolute;

            inset: 3px;

            border:
                1px solid
                rgba(229,196,151,.28);

            pointer-events: none;
        }


        .hero-button:hover {

            transform:
                translateY(-3px);

            background:
                linear-gradient(
                    180deg,
                    #7b3b34,
                    #572622
                );

            box-shadow:

                0 11px 25px
                rgba(0,0,0,.42),

                inset 0 1px 0
                rgba(255,255,255,.2);
        }


        /* =====================================================
           BOOK COVER
        ====================================================== */

        .cover-holder {

            position: absolute;

            z-index: 20;

            top: 73px;

            right: 4.8%;

            width:
                clamp(245px, 27vw, 300px);

            padding: 8px;

            background:

                linear-gradient(
                    135deg,
                    #73502e 0%,
                    #d4b078 18%,
                    #8b6339 39%,
                    #e0bd86 56%,
                    #654425 100%
                );

            box-shadow:

                0 22px 36px
                rgba(0,0,0,.54),

                0 5px 11px
                rgba(0,0,0,.45);
        }


        .cover-holder::before {

            content: "";

            position: absolute;

            inset: 3px;

            border:
                1px solid
                rgba(255,231,190,.75);

            pointer-events: none;

            z-index: 2;
        }


        .cover-holder::after {

            content: "";

            position: absolute;

            inset: 9px;

            border:
                1px solid
                rgba(80,53,30,.65);

            pointer-events: none;

            z-index: 2;
        }


        .cover {

            width: 100%;

            aspect-ratio:
                2 / 3;

            object-fit: cover;

            object-position: center;

            background: #080808;

            position: relative;

            z-index: 1;
        }


        /* =====================================================
           WORKS SECTION
        ====================================================== */

        .works {

            width: 100%;

            min-height: 372px;

            position: relative;

            background:
                #faf9f6;

            padding-top: 80px;

            padding-bottom: 70px;
        }


        .works-title {

            text-align: center;

            color:
                #4e2526;

            font-family:
                "Noto Naskh Arabic",
                serif;

            font-size:
                clamp(29px, 2.4vw, 36px);

            line-height: 1;

            font-weight: 600;

            margin-bottom: 43px;
        }


        /* =====================================================
           BOOK DISPLAY
        ====================================================== */

        .book-display {

            width:
                min(680px, 78%);

            height: 207px;

            margin: auto;

            position: relative;

            display: flex;

            align-items: flex-start;

            justify-content: center;

            gap:
                clamp(17px, 2.5vw, 28px);

            direction: ltr;
        }


        /* =====================================================
           UPCOMING BOOK
        ====================================================== */

        .upcoming-book {

            width:
                clamp(83px, 10vw, 106px);

            height:
                clamp(137px, 15.5vw, 157px);

            position: relative;

            background:

                linear-gradient(
                    90deg,
                    #dcdcd9 0%,
                    #f9f9f7 8%,
                    #ffffff 35%,
                    #fafafa 82%,
                    #e8e8e5 100%
                );

            border:
                1px solid #dededb;

            box-shadow:

                -6px 1px 8px
                rgba(0,0,0,.11),

                5px 5px 11px
                rgba(0,0,0,.10);

            z-index: 3;

            transition:
                transform .35s ease;
        }


        .upcoming-book:hover {
            transform:
                translateY(-8px);
        }


        /* spine */

        .upcoming-book::before {

            content: "";

            position: absolute;

            top: 2px;

            left: -6px;

            width: 6px;

            height:
                calc(100% - 4px);

            background:

                linear-gradient(
                    90deg,
                    #cfcfcd,
                    #eeeeec
                );

            border-left:
                1px solid #c6c6c3;
        }


        /* page bottom */

        .upcoming-book::after {

            content: "";

            position: absolute;

            bottom: -5px;

            left: 4px;

            width:
                calc(100% - 2px);

            height: 6px;

            background:
                linear-gradient(
                    180deg,
                    rgba(0,0,0,.14),
                    transparent
                );

            filter:
                blur(2px);
        }


        /* =====================================================
           WOODEN SHELF
        ====================================================== */

        .shelf {

            position: absolute;

            left: 50%;

            bottom: 7px;

            transform:
                translateX(-50%);

            width:
                min(568px, 100%);

            height: 53px;

            background:

                linear-gradient(
                    180deg,
                    #967344 0%,
                    #76572d 35%,
                    #5b401e 58%,
                    #76572d 100%
                );

            box-shadow:

                0 10px 15px
                rgba(0,0,0,.22),

                inset 0 1px
                rgba(255,255,255,.2);

            z-index: 1;
        }


        .shelf::before {

            content: "";

            position: absolute;

            left: 0;
            right: 0;

            top: 1px;

            height: 3px;

            background:
                rgba(229,199,148,.33);

            filter:
                blur(1px);
        }


        .shelf::after {

            content: "";

            position: absolute;

            left: 0;
            right: 0;

            bottom: -6px;

            height: 6px;

            background:
                #4a3219;
        }


        /* =====================================================
           ABOUT SECTION
        ====================================================== */

        .about {

            width: 100%;

            min-height: 535px;

            position: relative;

            overflow: hidden;

            background:

                linear-gradient(
                    135deg,
                    #20262d 0%,
                    #292f36 48%,
                    #151a20 100%
                );

            color: white;
        }


        /* white left area */

        .about::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 27.2%;

            height: 100%;

            background:
                #faf9f6;

            z-index: 1;
        }


        /* marble texture */

        .about::after {

            content: "";

            position: absolute;

            inset: 0;

            opacity: .25;

            pointer-events: none;

            background:

                linear-gradient(
                    122deg,
                    transparent 0 23%,
                    rgba(255,255,255,.09) 23.3%,
                    transparent 23.8%
                ),

                linear-gradient(
                    157deg,
                    transparent 0 43%,
                    rgba(0,0,0,.45) 43.4%,
                    transparent 44%
                ),

                linear-gradient(
                    38deg,
                    transparent 0 69%,
                    rgba(255,255,255,.06) 69.3%,
                    transparent 70%
                ),

                linear-gradient(
                    170deg,
                    transparent 0 82%,
                    rgba(0,0,0,.35) 82.4%,
                    transparent 83%
                );
        }


        /* =====================================================
           ABOUT INNER
        ====================================================== */

        .about-inner {

            width:
                min(1100px, 88%);

            height: 535px;
